<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-label="Esquema das areas seletivas para faces vistas por baixo">
  <title>As áreas seletivas para faces</title>
  <desc>Esquema, nao reproducao anatomica: vista ventral do encefalo, com a area facial occipital e a area facial fusiforme marcadas nos dois hemisferios.</desc>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#1e1c2b">

    <text x="360" y="32" font-size="15" text-anchor="middle" fill="#605d75">encéfalo visto por baixo — frente no topo</text>

    <!-- silhueta ventral -->
    <path d="M360 60 C 268 60, 206 106, 200 176 C 194 250, 214 320, 236 388
             C 258 452, 300 494, 360 494 C 420 494, 462 452, 484 388
             C 506 320, 526 250, 520 176 C 514 106, 452 60, 360 60 Z"
          fill="#ffffff" stroke="#1e1c2b" stroke-width="3"/>
    <line x1="360" y1="62" x2="360" y2="492" stroke="#605d75" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="368" y="82" font-size="13.5" fill="#605d75">linha média</text>

    <!-- OFA (posterior) -->
    <ellipse cx="288" cy="424" rx="38" ry="26" fill="#a84a1a" fill-opacity="0.18" stroke="#a84a1a" stroke-width="2.5"/>
    <ellipse cx="432" cy="424" rx="38" ry="26" fill="#a84a1a" fill-opacity="0.18" stroke="#a84a1a" stroke-width="2.5"/>
    <text x="288" y="430" font-size="15" font-weight="700" text-anchor="middle" fill="#a84a1a">OFA</text>
    <text x="432" y="430" font-size="15" font-weight="700" text-anchor="middle" fill="#a84a1a">OFA</text>

    <!-- FFA -->
    <ellipse cx="276" cy="326" rx="42" ry="28" fill="#4b3ba6" fill-opacity="0.18" stroke="#4b3ba6" stroke-width="2.5"/>
    <ellipse cx="444" cy="326" rx="42" ry="28" fill="#4b3ba6" fill-opacity="0.18" stroke="#4b3ba6" stroke-width="2.5"/>
    <text x="276" y="332" font-size="15" font-weight="700" text-anchor="middle" fill="#4b3ba6">FFA</text>
    <text x="444" y="332" font-size="15" font-weight="700" text-anchor="middle" fill="#4b3ba6">FFA</text>

    <!-- ligacoes: e uma rede -->
    <g stroke="#605d75" stroke-width="2.5" stroke-dasharray="6 6" fill="none">
      <path d="M282 398 C 276 372, 276 358, 276 354"/>
      <path d="M438 398 C 444 372, 444 358, 444 354"/>
    </g>

    <!-- chamadas -->
    <line x1="486" y1="424" x2="596" y2="424" stroke="#a84a1a" stroke-width="2"/>
    <text x="602" y="418" font-size="15" font-weight="700" fill="#a84a1a">área facial occipital</text>
    <text x="602" y="440" font-size="13.5" fill="#605d75">lesionada em muitos</text>
    <text x="602" y="458" font-size="13.5" fill="#605d75">prosopagnósicos</text>

    <line x1="490" y1="326" x2="596" y2="326" stroke="#4b3ba6" stroke-width="2"/>
    <text x="602" y="320" font-size="15" font-weight="700" fill="#4b3ba6">área facial fusiforme</text>
    <text x="602" y="342" font-size="13.5" fill="#605d75">córtex temporal ventral</text>

    <!-- rodape -->
    <line x1="60" y1="512" x2="660" y2="512" stroke="#e6e2dc" stroke-width="2"/>
    <text x="60" y="536" font-size="14.5" fill="#605d75">O tracejado é o ponto: o processamento facial é de rede, não de lugar.</text>
    <text x="60" y="556" font-size="14.5" fill="#605d75">Esquema — as posições são aproximadas.</text>
  </g>
</svg>
