<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-label="Esquema da especializacao funcional das areas visuais">
  <title>Especialização funcional: de V1 a V5/MT</title>
  <desc>Esquema, nao reproducao anatomica: silhueta do hemisferio esquerdo visto de lado, com as areas visuais V1, V2, V3, V4 e V5/MT e a funcao atribuida a cada uma.</desc>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#1e1c2b">

    <text x="360" y="34" font-size="15" text-anchor="middle" fill="#605d75">hemisfério esquerdo, visto de lado — frente à esquerda</text>

    <!-- silhueta do cerebro -->
    <path d="M96 250 C 96 150, 210 92, 330 92 C 470 92, 596 150, 616 246
             C 632 320, 596 386, 520 408 C 470 422, 420 414, 372 418
             C 300 424, 232 412, 174 380 C 122 352, 96 306, 96 250 Z"
          fill="#ffffff" stroke="#1e1c2b" stroke-width="3"/>
    <!-- cerebelo -->
    <path d="M540 404 C 590 396, 620 360, 616 322 C 636 356, 630 412, 578 428 C 560 434, 546 420, 540 404 Z"
          fill="#faf9f6" stroke="#605d75" stroke-width="2"/>
    <!-- tronco -->
    <path d="M420 418 C 428 452, 440 470, 452 484" fill="none" stroke="#605d75" stroke-width="3"/>

    <!-- areas -->
    <path d="M560 214 C 600 226, 616 262, 610 296 C 592 322, 560 328, 536 314 C 528 274, 538 236, 560 214 Z"
          fill="#4b3ba6" fill-opacity="0.30" stroke="#4b3ba6" stroke-width="2.5"/>
    <path d="M536 314 C 560 328, 592 322, 610 296 C 604 336, 578 366, 540 372 C 516 356, 512 332, 536 314 Z"
          fill="#4b3ba6" fill-opacity="0.16" stroke="#4b3ba6" stroke-width="2.5"/>
    <ellipse cx="486" cy="238" rx="40" ry="32" fill="#a84a1a" fill-opacity="0.16" stroke="#a84a1a" stroke-width="2.5"/>
    <ellipse cx="470" cy="340" rx="42" ry="30" fill="#a84a1a" fill-opacity="0.16" stroke="#a84a1a" stroke-width="2.5"/>
    <ellipse cx="382" cy="292" rx="44" ry="32" fill="#a84a1a" fill-opacity="0.16" stroke="#a84a1a" stroke-width="2.5"/>

    <g font-size="16" font-weight="700" text-anchor="middle">
      <text x="574" y="272" fill="#4b3ba6">V1</text>
      <text x="558" y="348" fill="#4b3ba6">V2</text>
      <text x="486" y="244" fill="#a84a1a">V3</text>
      <text x="470" y="346" fill="#a84a1a">V4</text>
      <text x="382" y="298" fill="#a84a1a">V5/MT</text>
    </g>

    <!-- legenda -->
    <line x1="80" y1="470" x2="640" y2="470" stroke="#e6e2dc" stroke-width="2"/>
    <g font-size="16">
      <rect x="80" y="490" width="16" height="16" rx="3" fill="#4b3ba6" fill-opacity="0.30" stroke="#4b3ba6" stroke-width="2"/>
      <text x="108" y="503" font-weight="700">V1 e V2</text>
      <text x="196" y="503" fill="#605d75">estágio inicial — cor e forma, células que respondem a orientação</text>

      <rect x="80" y="524" width="16" height="16" rx="3" fill="#a84a1a" fill-opacity="0.16" stroke="#a84a1a" stroke-width="2"/>
      <text x="108" y="537" font-weight="700">V3</text>
      <text x="196" y="537" fill="#605d75">forma</text>
      <text x="300" y="537" font-weight="700">V4</text>
      <text x="352" y="537" fill="#605d75">cor</text>
      <text x="430" y="537" font-weight="700">V5/MT</text>
      <text x="510" y="537" fill="#605d75">movimento</text>
    </g>
    <text x="80" y="572" font-size="14.5" fill="#605d75">Áreas e funções segundo Zeki (1993, 2005). Esquema: as posições são aproximadas.</text>
  </g>
</svg>
