<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" role="img" aria-label="Leis da Gestalt da organizacao perceptual e discriminacao figura-fundo">
  <title>Quatro leis da Gestalt e a discriminação figura-fundo</title>
  <desc>Cinco demonstracoes: proximidade, similaridade, boa continuidade, fechamento e a ilusao da taca e dos dois rostos.</desc>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#1e1c2b">

    <!-- 1. proximidade -->
    <text x="40" y="34" font-size="17" font-weight="700">proximidade</text>
    <text x="40" y="56" font-size="14" fill="#605d75">o que está perto é agrupado</text>
    <g fill="#4b3ba6">
      <circle cx="54"  cy="96" r="9"/><circle cx="80"  cy="96" r="9"/>
      <circle cx="132" cy="96" r="9"/><circle cx="158" cy="96" r="9"/>
      <circle cx="210" cy="96" r="9"/><circle cx="236" cy="96" r="9"/>
      <circle cx="54"  cy="132" r="9"/><circle cx="80"  cy="132" r="9"/>
      <circle cx="132" cy="132" r="9"/><circle cx="158" cy="132" r="9"/>
      <circle cx="210" cy="132" r="9"/><circle cx="236" cy="132" r="9"/>
      <circle cx="54"  cy="168" r="9"/><circle cx="80"  cy="168" r="9"/>
      <circle cx="132" cy="168" r="9"/><circle cx="158" cy="168" r="9"/>
      <circle cx="210" cy="168" r="9"/><circle cx="236" cy="168" r="9"/>
    </g>
    <text x="145" y="204" font-size="13.5" text-anchor="middle" fill="#605d75">três colunas, não seis</text>

    <!-- 2. similaridade -->
    <text x="290" y="34" font-size="17" font-weight="700">similaridade</text>
    <text x="290" y="56" font-size="14" fill="#605d75">o que se parece é agrupado</text>
    <g>
      <g fill="#4b3ba6">
        <circle cx="304" cy="96" r="9"/><circle cx="356" cy="96" r="9"/><circle cx="408" cy="96" r="9"/>
        <circle cx="304" cy="132" r="9"/><circle cx="356" cy="132" r="9"/><circle cx="408" cy="132" r="9"/>
        <circle cx="304" cy="168" r="9"/><circle cx="356" cy="168" r="9"/><circle cx="408" cy="168" r="9"/>
      </g>
      <g fill="#a84a1a">
        <rect x="321" y="87" width="18" height="18"/><rect x="373" y="87" width="18" height="18"/><rect x="425" y="87" width="18" height="18"/>
        <rect x="321" y="123" width="18" height="18"/><rect x="373" y="123" width="18" height="18"/><rect x="425" y="123" width="18" height="18"/>
        <rect x="321" y="159" width="18" height="18"/><rect x="373" y="159" width="18" height="18"/><rect x="425" y="159" width="18" height="18"/>
      </g>
    </g>
    <text x="378" y="204" font-size="13.5" text-anchor="middle" fill="#605d75">colunas por forma, não linhas</text>

    <!-- 3. boa continuidade -->
    <text x="520" y="34" font-size="17" font-weight="700">boa continuidade</text>
    <text x="520" y="56" font-size="14" fill="#605d75">a curva mais suave vence</text>
    <g fill="none" stroke-width="5" stroke-linecap="round">
      <path d="M534 172 C 578 88, 646 88, 712 108" stroke="#4b3ba6"/>
      <path d="M556 88 C 596 148, 662 180, 714 176" stroke="#a84a1a"/>
    </g>
    <text x="624" y="204" font-size="13.5" text-anchor="middle" fill="#605d75">duas linhas que se cruzam</text>

    <!-- regua -->
    <line x1="40" y1="238" x2="720" y2="238" stroke="#e6e2dc" stroke-width="2"/>

    <!-- 4. fechamento -->
    <text x="40" y="278" font-size="17" font-weight="700">fechamento</text>
    <text x="40" y="300" font-size="14" fill="#605d75">a parte que falta é preenchida</text>
    <circle cx="150" cy="414" r="74" fill="none" stroke="#4b3ba6" stroke-width="7"
            stroke-linecap="round" stroke-dasharray="78 38.3"/>
    <text x="150" y="530" font-size="13.5" text-anchor="middle" fill="#605d75">você vê um círculo, não quatro arcos</text>

    <!-- 5. figura-fundo -->
    <text x="400" y="278" font-size="17" font-weight="700">figura e fundo</text>
    <text x="400" y="300" font-size="14" fill="#605d75">só um dos dois pode ser a figura por vez</text>

    <rect x="470" y="322" width="220" height="196" fill="#4b3ba6" fill-opacity="0.22" stroke="#4b3ba6" stroke-width="2.5"/>
    <g transform="translate(480,326)">
      <path d="M74 16
               C 78 30, 88 34, 88 46
               C 88 54, 76 56, 76 64
               C 76 74, 96 78, 96 88
               C 96 94, 84 94, 84 100
               C 84 108, 92 108, 92 116
               C 92 128, 76 132, 74 146
               L 74 168
               C 68 176, 56 178, 50 186
               L 150 186
               C 144 178, 132 176, 126 168
               L 126 146
               C 124 132, 108 128, 108 116
               C 108 108, 116 108, 116 100
               C 116 94, 104 94, 104 88
               C 104 78, 124 74, 124 64
               C 124 56, 112 54, 112 46
               C 112 34, 122 30, 126 16
               Z"
            fill="#faf9f6" stroke="#1e1c2b" stroke-width="2"/>
    </g>
    <text x="580" y="546" font-size="13.5" text-anchor="middle" fill="#605d75">uma taça — ou dois rostos de perfil</text>

    <!-- rodape -->
    <text x="40" y="600" font-size="14.5" fill="#605d75">Todas se subordinam à lei de Prägnanz: percebemos a organização mais simples possível do campo visual.</text>
    <text x="40" y="624" font-size="14.5" fill="#605d75">Koffka, Köhler e Wertheimer, primeira metade do século XX.</text>
  </g>
</svg>
