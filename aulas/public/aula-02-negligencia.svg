<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-label="Sinais da negligencia espacial em tres tarefas de papel e lapis">
  <title>Negligência espacial em três tarefas</title>
  <desc>Desenho do relogio com todos os numeros amontoados a direita; bissecao de linha com a marca deslocada para a direita do centro verdadeiro; tarefa de cancelamento com os alvos da esquerda intactos.</desc>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#1e1c2b">

    <!-- ============ relogio ============ -->
    <text x="40" y="40" font-size="16" font-weight="700">desenho do relógio</text>
    <text x="40" y="62" font-size="13.5" fill="#605d75">“ponha os números no mostrador”</text>

    <circle cx="150" cy="190" r="90" fill="#ffffff" stroke="#1e1c2b" stroke-width="3"/>
    <g font-size="17" font-weight="700" text-anchor="middle" fill="#a84a1a">
      <text x="156" y="128">12</text>
      <text x="184" y="137">1</text>
      <text x="198" y="148">2</text>
      <text x="208" y="161">3</text>
      <text x="215" y="176">4</text>
      <text x="218" y="192">5</text>
      <text x="217" y="209">6</text>
      <text x="212" y="225">7</text>
      <text x="203" y="239">8</text>
      <text x="191" y="250">9</text>
      <text x="177" y="259">10</text>
      <text x="161" y="263">11</text>
    </g>
    <path d="M64 122 A 90 90 0 0 0 64 258" fill="none" stroke="#b02a1f" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="94" y="196" font-size="14" font-weight="700" text-anchor="middle" fill="#b02a1f">vazio</text>

    <!-- ============ bisseccao ============ -->
    <text x="330" y="40" font-size="16" font-weight="700">bissecção de linha</text>
    <text x="330" y="62" font-size="13.5" fill="#605d75">“marque o meio da linha”</text>

    <line x1="330" y1="126" x2="700" y2="126" stroke="#1e1c2b" stroke-width="4"/>
    <line x1="515" y1="100" x2="515" y2="152" stroke="#605d75" stroke-width="2.5" stroke-dasharray="6 6"/>
    <text x="515" y="92" font-size="13" text-anchor="middle" fill="#605d75">centro real</text>
    <line x1="605" y1="104" x2="605" y2="148" stroke="#a84a1a" stroke-width="4"/>
    <text x="605" y="172" font-size="13.5" font-weight="700" text-anchor="middle" fill="#a84a1a">a marca do paciente</text>

    <!-- ============ cancelamento ============ -->
    <text x="330" y="230" font-size="16" font-weight="700">cancelamento</text>
    <text x="330" y="252" font-size="13.5" fill="#605d75">“risque todos os traços da folha”</text>

    <g stroke="#1e1c2b" stroke-width="3" stroke-linecap="round">
      <line x1="342" y1="278" x2="342" y2="300"/>
      <line x1="392" y1="292" x2="392" y2="314"/>
      <line x1="360" y1="330" x2="360" y2="352"/>
      <line x1="424" y1="342" x2="424" y2="364"/>
      <line x1="378" y1="380" x2="378" y2="402"/>
      <line x1="440" y1="278" x2="440" y2="300"/>
      <line x1="470" y1="336" x2="470" y2="358"/>
      <line x1="452" y1="392" x2="452" y2="414"/>
    </g>
    <g stroke="#1e1c2b" stroke-width="3" stroke-linecap="round">
      <line x1="546" y1="280" x2="546" y2="302"/>
      <line x1="600" y1="294" x2="600" y2="316"/>
      <line x1="566" y1="336" x2="566" y2="358"/>
      <line x1="636" y1="330" x2="636" y2="352"/>
      <line x1="588" y1="382" x2="588" y2="404"/>
      <line x1="664" y1="284" x2="664" y2="306"/>
      <line x1="656" y1="390" x2="656" y2="412"/>
    </g>
    <g stroke="#a84a1a" stroke-width="3.5" stroke-linecap="round">
      <line x1="534" y1="304" x2="558" y2="278"/>
      <line x1="588" y1="318" x2="612" y2="292"/>
      <line x1="554" y1="360" x2="578" y2="334"/>
      <line x1="624" y1="354" x2="648" y2="328"/>
      <line x1="576" y1="406" x2="600" y2="380"/>
      <line x1="652" y1="308" x2="676" y2="282"/>
      <line x1="644" y1="414" x2="668" y2="388"/>
    </g>
    <line x1="512" y1="266" x2="512" y2="426" stroke="#b02a1f" stroke-width="2.5" stroke-dasharray="7 7"/>
    <text x="420" y="446" font-size="14" font-weight="700" text-anchor="middle" fill="#b02a1f">nenhum riscado</text>
    <text x="604" y="446" font-size="14" font-weight="700" text-anchor="middle" fill="#a84a1a">todos riscados</text>

    <!-- rodape -->
    <line x1="40" y1="480" x2="720" y2="480" stroke="#e6e2dc" stroke-width="2"/>
    <text x="40" y="510" font-size="15" fill="#605d75">A lesão costuma ser à <tspan font-weight="700" fill="#1e1c2b">direita</tspan>, e quase todas as áreas ficam na <tspan font-weight="700" fill="#4b3ba6">rede ventral</tspan>.</text>
    <text x="40" y="534" font-size="15" fill="#605d75">O paciente não está cego do lado esquerdo — ele não o atende.</text>
  </g>
</svg>
