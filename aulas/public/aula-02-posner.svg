<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-label="O paradigma da pista de Posner">
  <title>O paradigma da pista, de Posner</title>
  <desc>O participante fixa o centro da tela sem mover os olhos. Uma pista indica um dos lados; o alvo aparece do lado indicado (pista valida) ou do lado oposto (pista invalida). Compara-se o tempo de reacao das duas condicoes.</desc>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#1e1c2b">

    <g font-size="13" font-weight="700" fill="#605d75" letter-spacing="1.1" text-anchor="middle">
      <text x="270" y="48">1 · FIXAÇÃO</text>
      <text x="450" y="48">2 · PISTA</text>
      <text x="630" y="48">3 · ALVO</text>
    </g>

    <!-- ================= linha 1: pista valida ================= -->
    <text x="30" y="118" font-size="17" font-weight="700" fill="#2c6e49">pista válida</text>
    <text x="30" y="140" font-size="13.5" fill="#605d75">o alvo aparece</text>
    <text x="30" y="158" font-size="13.5" fill="#605d75">onde a pista disse</text>

    <!-- frame 1 -->
    <rect x="190" y="70" width="160" height="100" rx="6" fill="#ffffff" stroke="#605d75" stroke-width="2"/>
    <rect x="206" y="100" width="44" height="40" fill="none" stroke="#1e1c2b" stroke-width="2"/>
    <rect x="290" y="100" width="44" height="40" fill="none" stroke="#1e1c2b" stroke-width="2"/>
    <g stroke="#1e1c2b" stroke-width="2.5"><line x1="262" y1="120" x2="278" y2="120"/><line x1="270" y1="112" x2="270" y2="128"/></g>

    <!-- frame 2 -->
    <rect x="370" y="70" width="160" height="100" rx="6" fill="#ffffff" stroke="#605d75" stroke-width="2"/>
    <rect x="386" y="100" width="44" height="40" fill="none" stroke="#a84a1a" stroke-width="5"/>
    <rect x="470" y="100" width="44" height="40" fill="none" stroke="#1e1c2b" stroke-width="2"/>
    <g stroke="#1e1c2b" stroke-width="2.5"><line x1="442" y1="120" x2="458" y2="120"/><line x1="450" y1="112" x2="450" y2="128"/></g>

    <!-- frame 3 -->
    <rect x="550" y="70" width="160" height="100" rx="6" fill="#ffffff" stroke="#605d75" stroke-width="2"/>
    <rect x="566" y="100" width="44" height="40" fill="none" stroke="#1e1c2b" stroke-width="2"/>
    <circle cx="588" cy="120" r="11" fill="#1e1c2b"/>
    <rect x="650" y="100" width="44" height="40" fill="none" stroke="#1e1c2b" stroke-width="2"/>
    <g stroke="#1e1c2b" stroke-width="2.5"><line x1="622" y1="120" x2="638" y2="120"/><line x1="630" y1="112" x2="630" y2="128"/></g>

    <!-- ================= linha 2: pista invalida ================= -->
    <text x="30" y="248" font-size="17" font-weight="700" fill="#b02a1f">pista inválida</text>
    <text x="30" y="270" font-size="13.5" fill="#605d75">o alvo aparece</text>
    <text x="30" y="288" font-size="13.5" fill="#605d75">do lado oposto</text>

    <rect x="190" y="200" width="160" height="100" rx="6" fill="#ffffff" stroke="#605d75" stroke-width="2"/>
    <rect x="206" y="230" width="44" height="40" fill="none" stroke="#1e1c2b" stroke-width="2"/>
    <rect x="290" y="230" width="44" height="40" fill="none" stroke="#1e1c2b" stroke-width="2"/>
    <g stroke="#1e1c2b" stroke-width="2.5"><line x1="262" y1="250" x2="278" y2="250"/><line x1="270" y1="242" x2="270" y2="258"/></g>

    <rect x="370" y="200" width="160" height="100" rx="6" fill="#ffffff" stroke="#605d75" stroke-width="2"/>
    <rect x="386" y="230" width="44" height="40" fill="none" stroke="#a84a1a" stroke-width="5"/>
    <rect x="470" y="230" width="44" height="40" fill="none" stroke="#1e1c2b" stroke-width="2"/>
    <g stroke="#1e1c2b" stroke-width="2.5"><line x1="442" y1="250" x2="458" y2="250"/><line x1="450" y1="242" x2="450" y2="258"/></g>

    <rect x="550" y="200" width="160" height="100" rx="6" fill="#ffffff" stroke="#605d75" stroke-width="2"/>
    <rect x="566" y="230" width="44" height="40" fill="none" stroke="#1e1c2b" stroke-width="2"/>
    <rect x="650" y="230" width="44" height="40" fill="none" stroke="#1e1c2b" stroke-width="2"/>
    <circle cx="672" cy="250" r="11" fill="#1e1c2b"/>
    <g stroke="#1e1c2b" stroke-width="2.5"><line x1="622" y1="250" x2="638" y2="250"/><line x1="630" y1="242" x2="630" y2="258"/></g>

    <!-- ================= tempo de reacao ================= -->
    <line x1="30" y1="336" x2="730" y2="336" stroke="#e6e2dc" stroke-width="2"/>
    <text x="30" y="372" font-size="16" font-weight="700">o que se mede: o tempo de reação ao alvo</text>

    <g font-size="14.5">
      <text x="30" y="412" fill="#2c6e49" font-weight="700">válida</text>
      <rect x="150" y="396" width="220" height="22" rx="4" fill="#2c6e49" fill-opacity="0.55"/>
      <text x="382" y="412" fill="#605d75">mais rápido</text>

      <text x="30" y="450" fill="#605d75" font-weight="700">neutra</text>
      <rect x="150" y="434" width="300" height="22" rx="4" fill="#605d75" fill-opacity="0.45"/>
      <text x="462" y="450" fill="#605d75">intermediário</text>

      <text x="30" y="488" fill="#b02a1f" font-weight="700">inválida</text>
      <rect x="150" y="472" width="400" height="22" rx="4" fill="#b02a1f" fill-opacity="0.50"/>
      <text x="562" y="488" fill="#605d75">mais lento</text>
    </g>

    <line x1="30" y1="522" x2="730" y2="522" stroke="#e6e2dc" stroke-width="2"/>
    <text x="30" y="552" font-size="14.5" fill="#605d75">O olhar não se move em nenhum dos quadros: é <tspan font-weight="700" fill="#1e1c2b">atenção encoberta</tspan>. O que se deslocou foi só a atenção —</text>
    <text x="30" y="574" font-size="14.5" fill="#605d75">e a diferença entre as três barras é a medida desse deslocamento. Posner (1980).</text>
  </g>
</svg>
