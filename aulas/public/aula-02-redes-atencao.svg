<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" role="img" aria-label="Esquema das redes de atencao dorsal e ventral">
  <title>As duas redes de atenção</title>
  <desc>Esquema, nao reproducao anatomica: a rede dorsal, frontoparietal e bilateral, dirigida pelo objetivo; e a rede ventral, no hemisferio direito, dirigida pelo estimulo.</desc>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#1e1c2b">

    <text x="360" y="32" font-size="15" text-anchor="middle" fill="#605d75">visto de lado — frente à esquerda</text>

    <path d="M96 250 C 96 150, 210 92, 330 92 C 470 92, 596 150, 616 246
             C 632 320, 596 386, 520 408 C 470 422, 420 414, 372 418
             C 300 424, 232 412, 174 380 C 122 352, 96 306, 96 250 Z"
          fill="#ffffff" stroke="#1e1c2b" stroke-width="3"/>

    <!-- ===== rede dorsal ===== -->
    <g fill="#a84a1a">
      <circle cx="196" cy="176" r="17"/>
      <circle cx="262" cy="146" r="17"/>
      <circle cx="376" cy="140" r="17"/>
      <circle cx="452" cy="160" r="17"/>
    </g>
    <g stroke="#a84a1a" stroke-width="4" fill="none">
      <path d="M196 176 L262 146"/>
      <path d="M262 146 L376 140"/>
      <path d="M376 140 L452 160"/>
    </g>
    <g font-size="13.5" font-weight="700" fill="#a84a1a" text-anchor="middle">
      <text x="196" y="212">COF</text>
      <text x="262" y="120">JFI</text>
      <text x="376" y="114">SIP</text>
      <text x="452" y="134">LPS</text>
    </g>

    <!-- ===== rede ventral ===== -->
    <g fill="#4b3ba6">
      <circle cx="220" cy="300" r="17"/>
      <circle cx="300" cy="336" r="17"/>
      <circle cx="392" cy="348" r="17"/>
      <circle cx="466" cy="330" r="17"/>
    </g>
    <g stroke="#4b3ba6" stroke-width="4" fill="none">
      <path d="M220 300 L300 336"/>
      <path d="M300 336 L392 348"/>
      <path d="M392 348 L466 330"/>
    </g>
    <g font-size="13.5" font-weight="700" fill="#4b3ba6" text-anchor="middle">
      <text x="220" y="272">GFI</text>
      <text x="300" y="374">Ins</text>
      <text x="392" y="386">GTS</text>
      <text x="466" y="366">GSM · JTP</text>
    </g>

    <!-- legenda -->
    <line x1="60" y1="452" x2="700" y2="452" stroke="#e6e2dc" stroke-width="2"/>

    <g>
      <circle cx="70" cy="486" r="9" fill="#a84a1a"/>
      <text x="92" y="492" font-size="17" font-weight="700" fill="#a84a1a">rede dorsal</text>
      <text x="228" y="492" font-size="15.5" fill="#605d75">dirigida pelo objetivo — nos dois hemisférios</text>
      <text x="92" y="516" font-size="14" fill="#605d75">sulco intraparietal (SIP), lóbulo parietal superior (LPS),</text>
      <text x="92" y="536" font-size="14" fill="#605d75">campo ocular frontal (COF), junção frontal inferior (JFI)</text>
    </g>

    <g>
      <circle cx="70" cy="576" r="9" fill="#4b3ba6"/>
      <text x="92" y="582" font-size="17" font-weight="700" fill="#4b3ba6">rede ventral</text>
      <text x="228" y="582" font-size="15.5" fill="#605d75">dirigida pelo estímulo — só à direita</text>
      <text x="92" y="606" font-size="14" fill="#605d75">giro frontal inferior (GFI), ínsula (Ins), giro temporal superior (GTS),</text>
      <text x="92" y="626" font-size="14" fill="#605d75">giro supramarginal (GSM), junção têmporo-parietal (JTP)</text>
    </g>
  </g>
</svg>
