<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Esquema da condicao em que a atencao dividida funciona">
  <title>Quando a atenção dividida funciona</title>
  <desc>Duas tarefas simultaneas so vao bem quando uma delas e processada automaticamente; se as duas exigem processamento controlado, elas disputam a mesma capacidade limitada.</desc>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#1e1c2b">

    <!-- ===== caso que funciona ===== -->
    <text x="40" y="40" font-size="18" font-weight="700" fill="#2c6e49">funciona</text>
    <rect x="40" y="58" width="330" height="188" rx="10" fill="#2c6e49" fill-opacity="0.07" stroke="#2c6e49" stroke-width="2.5"/>

    <rect x="64" y="84" width="132" height="58" rx="8" fill="#ffffff" stroke="#605d75" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="130" y="108" font-size="15" font-weight="700" text-anchor="middle">tarefa A</text>
    <text x="130" y="130" font-size="13.5" text-anchor="middle" fill="#605d75">automática</text>

    <rect x="64" y="162" width="132" height="58" rx="8" fill="#ffffff" stroke="#1e1c2b" stroke-width="2.5"/>
    <text x="130" y="186" font-size="15" font-weight="700" text-anchor="middle">tarefa B</text>
    <text x="130" y="208" font-size="13.5" text-anchor="middle" fill="#605d75">controlada</text>

    <g stroke="#605d75" stroke-width="3" fill="none" marker-end="url(#ok)">
      <path d="M196 113 C 230 113, 232 140, 250 148"/>
      <path d="M196 191 C 230 191, 232 172, 250 164"/>
    </g>
    <rect x="254" y="120" width="106" height="72" rx="8" fill="#2c6e49" fill-opacity="0.16" stroke="#2c6e49" stroke-width="2.5"/>
    <text x="307" y="150" font-size="13" font-weight="700" text-anchor="middle" fill="#2c6e49">capacidade</text>
    <text x="307" y="168" font-size="13" font-weight="700" text-anchor="middle" fill="#2c6e49">limitada</text>
    <text x="307" y="184" font-size="12.5" text-anchor="middle" fill="#605d75">sobra espaço</text>

    <!-- ===== caso que nao funciona ===== -->
    <text x="410" y="40" font-size="18" font-weight="700" fill="#b02a1f">não funciona</text>
    <rect x="410" y="58" width="330" height="188" rx="10" fill="#b02a1f" fill-opacity="0.06" stroke="#b02a1f" stroke-width="2.5"/>

    <rect x="434" y="84" width="132" height="58" rx="8" fill="#ffffff" stroke="#1e1c2b" stroke-width="2.5"/>
    <text x="500" y="108" font-size="15" font-weight="700" text-anchor="middle">tarefa A</text>
    <text x="500" y="130" font-size="13.5" text-anchor="middle" fill="#605d75">controlada</text>

    <rect x="434" y="162" width="132" height="58" rx="8" fill="#ffffff" stroke="#1e1c2b" stroke-width="2.5"/>
    <text x="500" y="186" font-size="15" font-weight="700" text-anchor="middle">tarefa B</text>
    <text x="500" y="208" font-size="13.5" text-anchor="middle" fill="#605d75">controlada</text>

    <g stroke="#b02a1f" stroke-width="3" fill="none" marker-end="url(#nok)">
      <path d="M566 113 C 600 113, 602 140, 620 148"/>
      <path d="M566 191 C 600 191, 602 172, 620 164"/>
    </g>
    <rect x="624" y="120" width="106" height="72" rx="8" fill="#b02a1f" fill-opacity="0.16" stroke="#b02a1f" stroke-width="2.5"/>
    <text x="677" y="150" font-size="13" font-weight="700" text-anchor="middle" fill="#b02a1f">capacidade</text>
    <text x="677" y="168" font-size="13" font-weight="700" text-anchor="middle" fill="#b02a1f">limitada</text>
    <text x="677" y="184" font-size="12.5" text-anchor="middle" fill="#605d75">disputa</text>

    <defs>
      <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#605d75"/>
      </marker>
      <marker id="nok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#b02a1f"/>
      </marker>
    </defs>

  </g>
</svg>
