<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" aria-label="Esquema da via retina-geniculado-estriado">
  <title>A via retina-geniculado-estriado</title>
  <desc>Esquema: cada metade do campo visual chega ao hemisferio oposto. Da retina, pelo quiasma optico, ao nucleo geniculado lateral do talamo e dai as areas V1 e V2 do lobo occipital.</desc>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#1e1c2b">

    <!-- campo visual -->
    <rect x="110" y="26" width="250" height="46" fill="#a84a1a" fill-opacity="0.14" stroke="#a84a1a" stroke-width="2"/>
    <rect x="360" y="26" width="250" height="46" fill="#4b3ba6" fill-opacity="0.12" stroke="#4b3ba6" stroke-width="2"/>
    <text x="235" y="55" font-size="17" font-weight="600" text-anchor="middle" fill="#a84a1a">campo visual esquerdo</text>
    <text x="485" y="55" font-size="17" font-weight="600" text-anchor="middle" fill="#4b3ba6">campo visual direito</text>

    <!-- olhos -->
    <g stroke="#1e1c2b" stroke-width="2.5" fill="#ffffff">
      <circle cx="270" cy="160" r="44"/>
      <circle cx="450" cy="160" r="44"/>
    </g>
    <path d="M270 116 A 44 44 0 0 0 270 204 Z" fill="#4b3ba6" fill-opacity="0.12"/>
    <path d="M270 116 A 44 44 0 0 1 270 204 Z" fill="#a84a1a" fill-opacity="0.14"/>
    <path d="M450 116 A 44 44 0 0 0 450 204 Z" fill="#4b3ba6" fill-opacity="0.12"/>
    <path d="M450 116 A 44 44 0 0 1 450 204 Z" fill="#a84a1a" fill-opacity="0.14"/>
    <g stroke="#1e1c2b" stroke-width="2.5" fill="none">
      <circle cx="270" cy="160" r="44"/><line x1="270" y1="116" x2="270" y2="204"/>
      <circle cx="450" cy="160" r="44"/><line x1="450" y1="116" x2="450" y2="204"/>
    </g>
    <text x="192" y="166" font-size="15" text-anchor="end" fill="#605d75">retina</text>
    <line x1="196" y1="161" x2="228" y2="161" stroke="#605d75" stroke-width="1.5"/>

    <!-- fibras: campo esquerdo (terracota) vai para o hemisferio direito -->
    <g fill="none" stroke-width="3.5" stroke-linecap="round">
      <path d="M256 202 C 250 240, 400 250, 470 300" stroke="#a84a1a"/>
      <path d="M436 202 C 440 250, 452 260, 470 300" stroke="#a84a1a"/>
      <path d="M284 202 C 280 250, 268 260, 250 300" stroke="#4b3ba6"/>
      <path d="M464 202 C 470 240, 320 250, 250 300" stroke="#4b3ba6"/>
    </g>

    <!-- quiasma -->
    <circle cx="360" cy="246" r="7" fill="#1e1c2b"/>
    <line x1="368" y1="244" x2="486" y2="230" stroke="#605d75" stroke-width="1.5"/>
    <text x="492" y="234" font-size="15" font-weight="600" fill="#1e1c2b">quiasma óptico</text>

    <!-- LGN -->
    <g stroke="#1e1c2b" stroke-width="2.5" fill="#ffffff">
      <rect x="176" y="300" width="148" height="56" rx="8"/>
      <rect x="396" y="300" width="148" height="56" rx="8"/>
    </g>
    <text x="250" y="326" font-size="16" font-weight="700" text-anchor="middle">LGN esquerdo</text>
    <text x="250" y="345" font-size="13.5" text-anchor="middle" fill="#605d75">tálamo</text>
    <text x="470" y="326" font-size="16" font-weight="700" text-anchor="middle">LGN direito</text>
    <text x="470" y="345" font-size="13.5" text-anchor="middle" fill="#605d75">tálamo</text>

    <!-- setas LGN -> V1 -->
    <g stroke="#1e1c2b" stroke-width="3" fill="none" marker-end="url(#pt)">
      <line x1="250" y1="356" x2="250" y2="418"/>
      <line x1="470" y1="356" x2="470" y2="418"/>
    </g>
    <defs>
      <marker id="pt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#1e1c2b"/>
      </marker>
    </defs>

    <!-- V1 -->
    <g stroke="#4b3ba6" stroke-width="3" fill="#4b3ba6" fill-opacity="0.10">
      <rect x="176" y="424" width="148" height="60" rx="8"/>
      <rect x="396" y="424" width="148" height="60" rx="8"/>
    </g>
    <text x="250" y="450" font-size="17" font-weight="700" text-anchor="middle" fill="#4b3ba6">V1 · V2</text>
    <text x="250" y="470" font-size="13.5" text-anchor="middle" fill="#605d75">hemisfério esquerdo</text>
    <text x="470" y="450" font-size="17" font-weight="700" text-anchor="middle" fill="#4b3ba6">V1 · V2</text>
    <text x="470" y="470" font-size="13.5" text-anchor="middle" fill="#605d75">hemisfério direito</text>
    <text x="360" y="506" font-size="14" text-anchor="middle" fill="#605d75">córtex visual, lobo occipital</text>

    <!-- retinotopia -->
    <line x1="110" y1="536" x2="610" y2="536" stroke="#e6e2dc" stroke-width="2"/>
    <text x="360" y="566" font-size="16" font-weight="700" text-anchor="middle">retinotopia</text>
    <text x="360" y="590" font-size="14.5" text-anchor="middle" fill="#605d75">dois pontos vizinhos na retina continuam vizinhos em V1</text>
    <text x="360" y="614" font-size="14.5" text-anchor="middle" fill="#605d75">dentro do LGN correm duas vias: a P (cor e detalhe) e a M (movimento)</text>
  </g>
</svg>
