<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-label="Esquema das correntes ventral e dorsal do processamento visual">
  <title>As correntes ventral e dorsal</title>
  <desc>Esquema, nao reproducao anatomica: a partir de V1, a corrente dorsal sobe para o cortex parietal posterior (visao para a acao) e a corrente ventral segue para o cortex temporal inferior (visao para a percepcao).</desc>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#1e1c2b">

    <text x="360" y="32" font-size="15" text-anchor="middle" fill="#605d75">hemisfério esquerdo, visto de lado — frente à esquerda</text>

    <path d="M96 250 C 96 150, 210 92, 330 92 C 470 92, 596 150, 616 246
             C 632 320, 596 386, 520 408 C 470 422, 420 414, 372 418
             C 300 424, 232 412, 174 380 C 122 352, 96 306, 96 250 Z"
          fill="#ffffff" stroke="#1e1c2b" stroke-width="3"/>
    <path d="M540 404 C 590 396, 620 360, 616 322 C 636 356, 630 412, 578 428 C 560 434, 546 420, 540 404 Z"
          fill="#faf9f6" stroke="#605d75" stroke-width="2"/>

    <!-- V1 -->
    <ellipse cx="574" cy="272" rx="34" ry="34" fill="#605d75" fill-opacity="0.20" stroke="#605d75" stroke-width="2.5"/>
    <text x="574" y="278" font-size="16" font-weight="700" text-anchor="middle">V1</text>

    <!-- corrente dorsal -->
    <path d="M548 246 C 500 190, 420 158, 336 160" fill="none" stroke="#a84a1a" stroke-width="9"
          stroke-linecap="round" marker-end="url(#setaD)"/>
    <ellipse cx="326" cy="160" rx="58" ry="38" fill="#a84a1a" fill-opacity="0.16" stroke="#a84a1a" stroke-width="2.5"/>
    <text x="326" y="156" font-size="14.5" font-weight="700" text-anchor="middle" fill="#a84a1a">córtex parietal</text>
    <text x="326" y="176" font-size="14.5" font-weight="700" text-anchor="middle" fill="#a84a1a">posterior</text>

    <!-- corrente ventral -->
    <path d="M556 302 C 512 356, 434 378, 350 372" fill="none" stroke="#4b3ba6" stroke-width="9"
          stroke-linecap="round" marker-end="url(#setaV)"/>
    <ellipse cx="338" cy="372" rx="60" ry="36" fill="#4b3ba6" fill-opacity="0.14" stroke="#4b3ba6" stroke-width="2.5"/>
    <text x="338" y="368" font-size="14.5" font-weight="700" text-anchor="middle" fill="#4b3ba6">córtex temporal</text>
    <text x="338" y="388" font-size="14.5" font-weight="700" text-anchor="middle" fill="#4b3ba6">inferior</text>

    <defs>
      <marker id="setaD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#a84a1a"/>
      </marker>
      <marker id="setaV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#4b3ba6"/>
      </marker>
    </defs>

    <text x="424" y="128" font-size="19" font-weight="700" text-anchor="middle" fill="#a84a1a">corrente dorsal · “como”</text>
    <text x="430" y="428" font-size="19" font-weight="700" text-anchor="middle" fill="#4b3ba6">corrente ventral · “o quê”</text>

    <!-- legenda -->
    <line x1="70" y1="470" x2="650" y2="470" stroke="#e6e2dc" stroke-width="2"/>
    <g font-size="16">
      <rect x="70" y="490" width="16" height="16" rx="3" fill="#a84a1a" stroke="#a84a1a" stroke-width="2"/>
      <text x="98" y="503" font-weight="700" fill="#a84a1a">visão para a ação</text>
      <text x="252" y="503" fill="#605d75">pegar, desviar, rebater — guia o movimento no instante em que ele acontece</text>

      <rect x="70" y="524" width="16" height="16" rx="3" fill="#4b3ba6" stroke="#4b3ba6" stroke-width="2"/>
      <text x="98" y="537" font-weight="700" fill="#4b3ba6">visão para a percepção</text>
      <text x="282" y="537" fill="#605d75">reconhecer o que o objeto é — e guardar isso para depois</text>
    </g>
    <text x="70" y="570" font-size="14.5" fill="#605d75">Milner e Goodale (1995, 2008). Esquema: as posições são aproximadas —</text>
    <text x="70" y="590" font-size="14.5" fill="#605d75">e as duas correntes têm muitas interconexões.</text>
  </g>
</svg>
