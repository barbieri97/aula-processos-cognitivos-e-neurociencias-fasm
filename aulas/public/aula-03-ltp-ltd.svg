<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" role="img" aria-label="LTP e LTD na sinapse">
  <title>LTP e LTD: a mesma sinapse em dois estados</title>
  <desc>Duas sinapses lado a lado. Na potenciacao de longa duracao, o sinal e forte, ha mais vesiculas, mais neurotransmissor na fenda e mais receptores. Na depressao de longa duracao, tudo isso e menor.</desc>

  <defs>
    <marker id="s-ltp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b3ba6"/>
    </marker>
    <marker id="s-ltd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a84a1a"/>
    </marker>
  </defs>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#1e1c2b">

    <!-- títulos -->
    <text x="155" y="40" font-size="26" font-weight="700" text-anchor="middle" fill="#4b3ba6">LTP</text>
    <text x="155" y="62" font-size="12" text-anchor="middle" fill="#605d75">potenciação de longa duração</text>
    <text x="465" y="40" font-size="26" font-weight="700" text-anchor="middle" fill="#a84a1a">LTD</text>
    <text x="465" y="62" font-size="12" text-anchor="middle" fill="#605d75">depressão de longa duração</text>

    <rect x="10" y="78" width="290" height="290" rx="12" fill="#4b3ba6" fill-opacity="0.05" stroke="#4b3ba6" stroke-width="2" stroke-opacity="0.4"/>
    <rect x="320" y="78" width="290" height="290" rx="12" fill="#a84a1a" fill-opacity="0.05" stroke="#a84a1a" stroke-width="2" stroke-opacity="0.4"/>

    <!-- ============ LTP ============ -->
    <path d="M155 90 V 118" stroke="#4b3ba6" stroke-width="9" fill="none" marker-end="url(#s-ltp)"/>
    <rect x="65" y="122" width="180" height="72" rx="26" fill="#ffffff" stroke="#4b3ba6" stroke-width="2.5"/>
    <g fill="#4b3ba6" fill-opacity="0.75">
      <circle cx="115" cy="148" r="7"/><circle cx="140" cy="142" r="7"/><circle cx="165" cy="146" r="7"/>
      <circle cx="190" cy="150" r="7"/><circle cx="125" cy="170" r="7"/><circle cx="150" cy="174" r="7"/>
      <circle cx="178" cy="170" r="7"/><circle cx="200" cy="164" r="7"/>
    </g>
    <g fill="#4b3ba6">
      <circle cx="90" cy="206" r="4"/><circle cx="110" cy="212" r="4"/><circle cx="130" cy="202" r="4"/>
      <circle cx="150" cy="210" r="4"/><circle cx="170" cy="204" r="4"/><circle cx="190" cy="212" r="4"/>
      <circle cx="210" cy="206" r="4"/><circle cx="100" cy="199" r="4"/><circle cx="140" cy="217" r="4"/>
      <circle cx="180" cy="217" r="4"/><circle cx="220" cy="199" r="4"/>
    </g>
    <rect x="65" y="222" width="180" height="72" rx="26" fill="#ffffff" stroke="#4b3ba6" stroke-width="2.5"/>
    <g fill="#4b3ba6">
      <rect x="78" y="215" width="10" height="14" rx="3"/><rect x="104" y="215" width="10" height="14" rx="3"/>
      <rect x="130" y="215" width="10" height="14" rx="3"/><rect x="156" y="215" width="10" height="14" rx="3"/>
      <rect x="182" y="215" width="10" height="14" rx="3"/><rect x="208" y="215" width="10" height="14" rx="3"/>
      <rect x="230" y="215" width="10" height="14" rx="3"/>
    </g>
    <path d="M155 294 V 324" stroke="#4b3ba6" stroke-width="9" fill="none" stroke-opacity="0.5"/>
    <text x="155" y="350" font-size="15" font-weight="700" text-anchor="middle" fill="#4b3ba6">sinapse fortalecida</text>

    <!-- ============ LTD ============ -->
    <path d="M465 90 V 118" stroke="#a84a1a" stroke-width="2.5" fill="none" stroke-dasharray="5 4" marker-end="url(#s-ltd)"/>
    <rect x="375" y="122" width="180" height="72" rx="26" fill="#ffffff" stroke="#a84a1a" stroke-width="2.5"/>
    <g fill="#a84a1a" fill-opacity="0.75">
      <circle cx="435" cy="150" r="7"/><circle cx="462" cy="145" r="7"/>
      <circle cx="488" cy="152" r="7"/><circle cx="450" cy="172" r="7"/>
    </g>
    <g fill="#a84a1a">
      <circle cx="430" cy="206" r="4"/><circle cx="460" cy="212" r="4"/>
      <circle cx="490" cy="204" r="4"/><circle cx="445" cy="214" r="4"/>
    </g>
    <rect x="375" y="222" width="180" height="72" rx="26" fill="#ffffff" stroke="#a84a1a" stroke-width="2.5"/>
    <g fill="#a84a1a">
      <rect x="420" y="215" width="10" height="14" rx="3"/><rect x="460" y="215" width="10" height="14" rx="3"/>
      <rect x="500" y="215" width="10" height="14" rx="3"/>
    </g>
    <path d="M465 294 V 324" stroke="#a84a1a" stroke-width="2.5" fill="none" stroke-opacity="0.5" stroke-dasharray="5 4"/>
    <text x="465" y="350" font-size="15" font-weight="700" text-anchor="middle" fill="#a84a1a">sinapse enfraquecida</text>

    <!-- orientação -->
    <text x="310" y="402" font-size="12.5" text-anchor="middle" fill="#605d75">acima, o terminal pré-sináptico · abaixo, a espinha dendrítica</text>

  </g>
</svg>
