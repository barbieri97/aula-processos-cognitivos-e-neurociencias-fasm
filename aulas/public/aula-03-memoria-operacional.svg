<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" role="img" aria-label="Modelo de memoria operacional">
  <title>O modelo de memória operacional</title>
  <desc>Executivo central no topo, controlando tres subsistemas: alca fonologica, buffer episodico e esboco visuoespacial. Cada um troca informacao com um sistema cristalizado de longo prazo: linguagem, memoria episodica e semantica visual.</desc>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#605d75"/>
    </marker>
    <marker id="seta-i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b3ba6"/>
    </marker>
  </defs>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#1e1c2b">

    <!-- executivo central -->
    <rect x="110" y="30" width="400" height="58" rx="10" fill="#4b3ba6"/>
    <text x="310" y="59" font-size="19" font-weight="700" text-anchor="middle" fill="#faf9f6">executivo central</text>
    <text x="310" y="78" font-size="12.5" text-anchor="middle" fill="#faf9f6" fill-opacity="0.82">atenção e controle</text>

    <!-- conectores do executivo -->
    <g stroke="#4b3ba6" stroke-width="2.5" fill="none">
      <path d="M310 88 V 116"/>
      <path d="M110 116 H 510"/>
      <path d="M110 116 V 144" marker-end="url(#seta-i)"/>
      <path d="M310 116 V 144" marker-end="url(#seta-i)"/>
      <path d="M510 116 V 144" marker-end="url(#seta-i)"/>
    </g>

    <!-- subsistemas -->
    <g>
      <rect x="20" y="150" width="180" height="96" rx="9" fill="#4b3ba6" fill-opacity="0.09" stroke="#4b3ba6" stroke-width="2.5"/>
      <text x="110" y="188" font-size="15" font-weight="700" text-anchor="middle" fill="#4b3ba6">alça fonológica</text>
      <text x="110" y="212" font-size="12.5" text-anchor="middle" fill="#605d75">som e fala</text>
      <text x="110" y="230" font-size="12.5" text-anchor="middle" fill="#605d75">repetição subvocal</text>

      <rect x="220" y="150" width="180" height="96" rx="9" fill="#4b3ba6" fill-opacity="0.09" stroke="#4b3ba6" stroke-width="2.5"/>
      <text x="310" y="188" font-size="15" font-weight="700" text-anchor="middle" fill="#4b3ba6">buffer episódico</text>
      <text x="310" y="212" font-size="12.5" text-anchor="middle" fill="#605d75">integra os códigos</text>
      <text x="310" y="230" font-size="12.5" text-anchor="middle" fill="#605d75">num episódio só</text>

      <rect x="420" y="150" width="180" height="96" rx="9" fill="#4b3ba6" fill-opacity="0.09" stroke="#4b3ba6" stroke-width="2.5"/>
      <text x="510" y="188" font-size="15" font-weight="700" text-anchor="middle" fill="#4b3ba6">esboço</text>
      <text x="510" y="207" font-size="15" font-weight="700" text-anchor="middle" fill="#4b3ba6">visuoespacial</text>
      <text x="510" y="230" font-size="12.5" text-anchor="middle" fill="#605d75">imagem e espaço</text>
    </g>

    <!-- trocas com o longo prazo: setas de duas pontas -->
    <g stroke="#605d75" stroke-width="2" fill="none">
      <path d="M110 254 V 322" marker-start="url(#seta)" marker-end="url(#seta)"/>
      <path d="M310 254 V 322" marker-start="url(#seta)" marker-end="url(#seta)"/>
      <path d="M510 254 V 322" marker-start="url(#seta)" marker-end="url(#seta)"/>
    </g>

    <!-- sistemas cristalizados -->
    <g>
      <rect x="20" y="330" width="180" height="72" rx="9" fill="#1e1c2b" fill-opacity="0.05" stroke="#605d75" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="110" y="372" font-size="14" text-anchor="middle" fill="#605d75">linguagem</text>

      <rect x="220" y="330" width="180" height="72" rx="9" fill="#1e1c2b" fill-opacity="0.05" stroke="#605d75" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="310" y="363" font-size="14" text-anchor="middle" fill="#605d75">memória episódica</text>
      <text x="310" y="383" font-size="14" text-anchor="middle" fill="#605d75">de longo prazo</text>

      <rect x="420" y="330" width="180" height="72" rx="9" fill="#1e1c2b" fill-opacity="0.05" stroke="#605d75" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="510" y="372" font-size="14" text-anchor="middle" fill="#605d75">semântica visual</text>
    </g>

    <!-- legenda -->
    <g>
      <rect x="118" y="432" width="14" height="14" rx="3" fill="#4b3ba6" fill-opacity="0.35" stroke="#4b3ba6" stroke-width="2"/>
      <text x="140" y="444" font-size="13" fill="#605d75">sistemas fluidos</text>
      <rect x="318" y="432" width="14" height="14" rx="3" fill="#1e1c2b" fill-opacity="0.05" stroke="#605d75" stroke-width="2" stroke-dasharray="3 2"/>
      <text x="340" y="444" font-size="13" fill="#605d75">sistemas cristalizados</text>
    </g>

  </g>
</svg>
