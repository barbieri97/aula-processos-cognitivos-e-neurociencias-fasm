<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-label="Os quatro processos da memoria">
  <title>Os quatro processos da memória</title>
  <desc>Codificacao, armazenamento, consolidacao e evocacao em sequencia; da evocacao parte um arco de volta ao armazenamento, marcado como reconsolidacao.</desc>

  <defs>
    <marker id="p-seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b3ba6"/>
    </marker>
    <marker id="p-seta-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a84a1a"/>
    </marker>
  </defs>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#1e1c2b">

    <!-- 1 codificação -->
    <circle cx="98" cy="46" r="19" fill="#4b3ba6"/>
    <text x="98" y="53" font-size="18" font-weight="700" text-anchor="middle" fill="#faf9f6">1</text>
    <rect x="10" y="80" width="176" height="110" rx="10" fill="#4b3ba6" fill-opacity="0.08" stroke="#4b3ba6" stroke-width="2.5"/>
    <text x="98" y="128" font-size="16.5" font-weight="700" text-anchor="middle" fill="#4b3ba6">codificação</text>
    <text x="98" y="154" font-size="12.5" text-anchor="middle" fill="#605d75">entrada da informação</text>

    <!-- 2 armazenamento -->
    <circle cx="326" cy="46" r="19" fill="#4b3ba6"/>
    <text x="326" y="53" font-size="18" font-weight="700" text-anchor="middle" fill="#faf9f6">2</text>
    <rect x="238" y="80" width="176" height="110" rx="10" fill="#4b3ba6" fill-opacity="0.08" stroke="#4b3ba6" stroke-width="2.5"/>
    <text x="326" y="128" font-size="16.5" font-weight="700" text-anchor="middle" fill="#4b3ba6">armazenamento</text>
    <text x="326" y="154" font-size="12.5" text-anchor="middle" fill="#605d75">manutenção do registro</text>

    <!-- 3 consolidação -->
    <circle cx="554" cy="46" r="19" fill="#4b3ba6"/>
    <text x="554" y="53" font-size="18" font-weight="700" text-anchor="middle" fill="#faf9f6">3</text>
    <rect x="466" y="80" width="176" height="110" rx="10" fill="#4b3ba6" fill-opacity="0.08" stroke="#4b3ba6" stroke-width="2.5"/>
    <text x="554" y="128" font-size="16.5" font-weight="700" text-anchor="middle" fill="#4b3ba6">consolidação</text>
    <text x="554" y="154" font-size="12.5" text-anchor="middle" fill="#605d75">estabilização do traço</text>

    <!-- 4 evocação -->
    <circle cx="782" cy="46" r="19" fill="#4b3ba6"/>
    <text x="782" y="53" font-size="18" font-weight="700" text-anchor="middle" fill="#faf9f6">4</text>
    <rect x="694" y="80" width="176" height="110" rx="10" fill="#4b3ba6" fill-opacity="0.08" stroke="#4b3ba6" stroke-width="2.5"/>
    <text x="782" y="128" font-size="16.5" font-weight="700" text-anchor="middle" fill="#4b3ba6">evocação</text>
    <text x="782" y="154" font-size="12.5" text-anchor="middle" fill="#605d75">resgate da memória</text>

    <!-- setas entre as etapas -->
    <g stroke="#4b3ba6" stroke-width="2.5" fill="none">
      <path d="M192 135 H 232" marker-end="url(#p-seta)"/>
      <path d="M420 135 H 460" marker-end="url(#p-seta)"/>
      <path d="M648 135 H 688" marker-end="url(#p-seta)"/>
    </g>

    <!-- arco de volta: reconsolidação -->
    <path d="M782 192 V 246 Q 782 264 764 264 H 344 Q 326 264 326 246 V 198"
          stroke="#a84a1a" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#p-seta-t)"/>
    <rect x="466" y="248" width="176" height="32" rx="8" fill="#faf9f6"/>
    <text x="554" y="269" font-size="15" font-weight="700" text-anchor="middle" fill="#a84a1a">reconsolidação</text>
    <text x="554" y="304" font-size="12.5" text-anchor="middle" fill="#605d75">evocar torna o traço lábil de novo</text>

  </g>
</svg>
