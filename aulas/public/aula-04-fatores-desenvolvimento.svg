<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 356" role="img" aria-label="Seis fatores do desenvolvimento da linguagem">
  <title>Seis fatores do desenvolvimento da linguagem</title>
  <desc>Duas colunas convergindo para a linguagem. Biologia: genetica, audicao e maturacao neural. Experiencia: ambiente, interacao social e estimulacao.</desc>

  <defs>
    <marker id="f-seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#605d75"/>
    </marker>
  </defs>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#1e1c2b">

    <text x="145" y="34" font-size="17" font-weight="700" text-anchor="middle" fill="#4b3ba6">biologia</text>
    <text x="475" y="34" font-size="17" font-weight="700" text-anchor="middle" fill="#a84a1a">experiência</text>

    <g stroke="#4b3ba6" stroke-width="2.5" fill="#4b3ba6" fill-opacity="0.12">
      <rect x="40" y="50" width="210" height="44" rx="8"/>
      <rect x="40" y="106" width="210" height="44" rx="8"/>
      <rect x="40" y="162" width="210" height="44" rx="8"/>
    </g>
    <g stroke="#a84a1a" stroke-width="2.5" fill="#a84a1a" fill-opacity="0.12">
      <rect x="370" y="50" width="210" height="44" rx="8"/>
      <rect x="370" y="106" width="210" height="44" rx="8"/>
      <rect x="370" y="162" width="210" height="44" rx="8"/>
    </g>

    <g font-size="15" font-weight="700" text-anchor="middle">
      <text x="145" y="77" fill="#4b3ba6">genética</text>
      <text x="145" y="133" fill="#4b3ba6">audição</text>
      <text x="145" y="189" fill="#4b3ba6">maturação neural</text>
      <text x="475" y="77" fill="#a84a1a">ambiente</text>
      <text x="475" y="133" fill="#a84a1a">interação social</text>
      <text x="475" y="189" fill="#a84a1a">estimulação</text>
    </g>

    <g stroke="#605d75" stroke-width="2.5" fill="none" marker-end="url(#f-seta)">
      <path d="M 145 212 C 145 256, 220 284, 250 290"/>
      <path d="M 475 212 C 475 256, 400 284, 370 290"/>
    </g>

    <rect x="230" y="268" width="160" height="50" rx="10" fill="#1e1c2b"/>
    <text x="310" y="299" font-size="18" font-weight="700" text-anchor="middle" fill="#faf9f6">linguagem</text>

  </g>
</svg>
