<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-label="Esquema das tres regioes do cortex pre-frontal">
  <title>Três regiões do córtex pré-frontal, em vista lateral e medial esquemáticas</title>
  <desc>Dois contornos esquematicos do hemisferio, com a frente a esquerda. Na vista lateral, o cortex pre-frontal dorsolateral na parte de cima e da frente do lobo frontal, e o orbitofrontal na base do lobo frontal, acima dos olhos. Na vista medial, o cingulado anterior, a frente do giro do cingulo acima do corpo caloso, e o orbitofrontal ventromedial na base.</desc>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#1e1c2b">

    <!-- ===== vista lateral ===== -->
    <g transform="translate(0 20) scale(0.8)">
      <path d="M 60 200 C 60 120, 140 70, 260 66 C 390 62, 510 110, 540 190 C 555 230, 540 270, 500 292 L 340 300 C 270 305, 190 300, 140 285 C 90 268, 60 245, 60 200 Z"
            fill="#1e1c2b" fill-opacity="0.04" stroke="#605d75" stroke-width="2.5"/>
      <!-- sulco central e fissura lateral, só para situar o lobo frontal -->
      <g stroke="#605d75" stroke-width="2" stroke-opacity="0.5" fill="none" stroke-dasharray="6 5">
        <path d="M 300 68 C 292 130, 282 190, 272 236"/>
        <path d="M 160 250 C 230 226, 310 222, 380 236"/>
      </g>
      <!-- dorsolateral -->
      <ellipse cx="160" cy="140" rx="70" ry="40" transform="rotate(-22 160 140)"
               fill="#4b3ba6" fill-opacity="0.75" stroke="#4b3ba6" stroke-width="2"/>
      <!-- orbitofrontal -->
      <ellipse cx="115" cy="250" rx="52" ry="18" transform="rotate(14 115 250)"
               fill="#a84a1a" fill-opacity="0.8" stroke="#a84a1a" stroke-width="2"/>
    </g>

    <!-- ===== vista medial ===== -->
    <g transform="translate(440 20) scale(0.8)">
      <path d="M 60 200 C 60 120, 140 70, 260 66 C 390 62, 510 110, 540 190 C 555 230, 540 270, 500 292 L 340 300 C 270 305, 190 300, 140 285 C 90 268, 60 245, 60 200 Z"
            fill="#1e1c2b" fill-opacity="0.04" stroke="#605d75" stroke-width="2.5"/>
      <!-- cerebelo -->
      <ellipse cx="486" cy="306" rx="58" ry="36" fill="#1e1c2b" fill-opacity="0.06" stroke="#605d75" stroke-width="2"/>
      <!-- corpo caloso -->
      <path d="M 190 196 C 220 150, 380 140, 420 188 C 396 178, 250 172, 214 206 Z"
            fill="#605d75" fill-opacity="0.35" stroke="#605d75" stroke-width="1.5"/>
      <!-- giro do cíngulo, inteiro e apagado -->
      <path d="M 170 214 C 170 130, 390 104, 446 186"
            stroke="#605d75" stroke-opacity="0.25" stroke-width="18" stroke-linecap="round" fill="none"/>
      <!-- cingulado anterior -->
      <path d="M 170 214 C 170 170, 210 140, 260 128"
            stroke="#9a5b00" stroke-width="18" stroke-linecap="round" fill="none"/>
      <!-- orbitofrontal / ventromedial -->
      <ellipse cx="120" cy="252" rx="52" ry="18" transform="rotate(14 120 252)"
               fill="#a84a1a" fill-opacity="0.8" stroke="#a84a1a" stroke-width="2"/>
    </g>

    <!-- ===== rótulos ===== -->
    <g stroke="#605d75" stroke-width="1.5" fill="none">
      <path d="M 84 50 L 116 112"/>
      <path d="M 60 304 L 86 228"/>
      <path d="M 604 50 L 610 118"/>
      <path d="M 500 304 L 530 230"/>
    </g>
    <g font-size="18" font-weight="700">
      <text x="40" y="42" fill="#4b3ba6">dorsolateral</text>
      <text x="40" y="324" fill="#a84a1a">orbitofrontal</text>
      <text x="560" y="42" fill="#9a5b00">cingulado anterior</text>
      <text x="480" y="324" fill="#a84a1a">orbitofrontal (ventromedial)</text>
    </g>
    <g font-size="13" fill="#605d75" text-anchor="end">
      <text x="432" y="352">vista lateral, frente à esquerda</text>
      <text x="872" y="352">vista medial, frente à esquerda</text>
    </g>

  </g>
</svg>
